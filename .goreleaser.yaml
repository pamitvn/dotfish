# goreleaser config — the Build step (docs/adr/0003).
#
# Cross-compiles the Installer (config payload embedded via go:embed) for
# linux/darwin × amd64/arm64 and publishes each as a raw binary release asset
# named "<binary>_<os>_<arch>", which the Install shim downloads directly.
#
#   goreleaser release --clean        (on a tag, in CI)
#   goreleaser build --snapshot --clean   (local test build)
version: 2

project_name: dotfish

before:
  hooks:
    - go mod tidy

builds:
  - id: installer
    main: ./cmd/installer
    binary: dotfish
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: raw
    formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Owner/name are inferred from the `origin` git remote, which in CI is whatever
# repo the workflow runs in. Pinning them here breaks the release whenever the
# repo moves, because GITHUB_TOKEN is only ever scoped to the running repo.
#
# GitHub Releases stays enabled for the tag page and changelog, but it is NOT
# the distribution channel — this repo is private, so its release assets need
# auth. The Install shim pulls from R2 instead (see `blobs` below).
release:

# Distribution — Cloudflare R2, served from a public bucket so `curl | sh` works
# against a private source repo. Credentials come from the release workflow:
# an R2 API token exposed as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
# Note: R2 rejects S3 ACLs, so `acl` is deliberately unset — make the bucket
# public via its Cloudflare settings (r2.dev subdomain or a custom domain).
blobs:
    # Immutable, tag-addressed copy. Nothing at this path ever changes, so it
    # can be cached forever — this is what a pinned DOTFILES_VERSION resolves to.
  - provider: s3
    bucket: '{{ envOrDefault "R2_BUCKET" "dotfiles-fish" }}'
    endpoint: 'https://{{ envOrDefault "R2_ACCOUNT_ID" "unset" }}.r2.cloudflarestorage.com'
    region: auto
    s3_force_path_style: true
    directory: "{{ .Tag }}"
    cache_control:
      - public
      - max-age=31536000
      - immutable

    # Rolling copy the shim hits directly, so a default install is one request
    # with no version lookup. It is overwritten every release, hence no-cache —
    # a stale edge copy here would pin users to the previous version.
  - provider: s3
    bucket: '{{ envOrDefault "R2_BUCKET" "dotfiles-fish" }}'
    endpoint: 'https://{{ envOrDefault "R2_ACCOUNT_ID" "unset" }}.r2.cloudflarestorage.com'
    region: auto
    s3_force_path_style: true
    directory: latest
    cache_control:
      - no-cache
